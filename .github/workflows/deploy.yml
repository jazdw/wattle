name: Check and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, migrate and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      # Checks the production build works; the deploy step rebuilds with the
      # real database id.
      - name: Build
        run: npm run build

      # Until the Cloudflare token and settings are set, CI only checks the code and the
      # deploy step is skipped (the run stays green).
      - name: Check deploy settings
        id: secrets
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CUSTOM_DOMAIN" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Deploy skipped: set the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID and CUSTOM_DOMAIN variables to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Finds (or creates) the D1 database by name, builds with its id, applies
      # migrations and deploys to the custom domain (scripts/deploy.mjs). The
      # account id and domain are repository variables (not secret, just not
      # committed); only the API token is a secret.
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Plain app settings, passed to the Worker as variables (unset: default).
          PLAID_ENV: ${{ vars.PLAID_ENV }}
          PLAID_ALLOW_REMOVE: ${{ vars.PLAID_ALLOW_REMOVE }}
          JOB_CHUNK_ROWS: ${{ vars.JOB_CHUNK_ROWS }}
          QUOTE_PROVIDER: ${{ vars.QUOTE_PROVIDER }}
          QUOTE_CACHE_SECONDS: ${{ vars.QUOTE_CACHE_SECONDS }}
          FX_PROVIDER: ${{ vars.FX_PROVIDER }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
        run: npm run deploy
